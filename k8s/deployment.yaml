apiVersion: apps/v1
kind: Deployment
metadata:
  name: rescue-network-deployment
  labels:
    app: rescue-network
    app.kubernetes.io/name: rescue-network
    app.kubernetes.io/instance: rescue-network-production
    app.kubernetes.io/part-of: devops-24eskcs089
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rescue-network
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rescue-network
    spec:
      containers:
        - name: rescue-network
          image: ghcr.io/skit-devops-2026/devops-24eskcs089:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: rescue-network-secrets
                  key: mongodb-uri
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
