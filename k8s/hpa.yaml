apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rescue-network-hpa
  labels:
    app: rescue-network
    app.kubernetes.io/name: rescue-network
    app.kubernetes.io/instance: rescue-network-production
    app.kubernetes.io/part-of: devops-24eskcs089
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rescue-network-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
